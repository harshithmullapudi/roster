[package]
name = "roster-desktop"
version = "0.1.5"
description = "Roster Desktop"
edition = "2021"
default-run = "roster-desktop"

[lib]
name = "roster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "roster-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
